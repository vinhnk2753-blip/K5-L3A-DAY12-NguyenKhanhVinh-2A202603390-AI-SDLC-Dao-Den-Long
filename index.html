<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Ba Hòn Đảo</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hud hidden">
        <div class="hud-top">
          <div class="hud-box hud-flames" id="hud-flames" aria-label="Ngọn Lửa"></div>
          <div class="hud-center-col">
            <div class="hud-box hud-timer" id="hud-timer">05:00</div>
            <div class="hud-wind hidden" id="hud-wind"></div>
          </div>
          <div class="hud-box hud-stats">
            <span id="hud-night">Đêm 1</span>
            <span class="sep">·</span>
            <span id="hud-lanterns">Đèn: 0/5</span>
            <span class="sep">·</span>
            <span id="hud-score">Điểm: 0</span>
            <span class="sep">·</span>
            <span id="hud-fps">-- FPS</span>
          </div>
        </div>

        <div class="hud-prompt hidden" id="hud-prompt"></div>
        <div class="lantern-arrow hidden" id="hud-arrow" title="Đèn chưa sáng gần nhất">➤</div>

        <div class="hud-bottom">
          <div class="hud-box hud-motes">
            <div class="motes-row">
              <span class="motes-label" id="hud-motes-label">Đom đóm: 0/10</span>
              <span class="charm-badge hidden" id="hud-charm">Bùa Gió: 10.0s</span>
            </div>
            <div class="motes-bar" id="hud-motes-bar"></div>
          </div>
          <div class="hud-box hud-skills">
            <div class="skill-pill" id="hud-dash">Shift · Lướt</div>
            <div class="skill-pill" id="hud-pulse">Q · Tỏa Sáng</div>
          </div>
        </div>
      </div>

      <div id="overlay" class="overlay">
        <div class="card" id="overlay-card"></div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
